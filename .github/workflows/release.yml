name: release

# Pornește la un tag (git tag v1.0.0 && git push --tags) sau manual din tab-ul Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: yarn install --frozen-lockfile

      # Tauri refuză build-ul dacă @tauri-apps/api și crate-ul `tauri` diferă la versiunea minor.
      # Aliniem pachetul npm la versiunea din Cargo.lock (ex. tauri 2.12.x -> @tauri-apps/api ~2.12.0).
      - name: Align @tauri-apps/api with the tauri crate
        shell: bash
        run: |
          TAURI_VER=$(grep -A1 '^name = "tauri"$' src-tauri/Cargo.lock | grep '^version' | cut -d'"' -f2)
          MINOR=$(echo "$TAURI_VER" | cut -d. -f1,2)
          echo "tauri crate $TAURI_VER -> @tauri-apps/api ~$MINOR.0"
          yarn upgrade "@tauri-apps/api@~$MINOR.0"
          yarn list --pattern "@tauri-apps/api" --depth=0

      # Verificări înainte de ambalare: dacă pică, nu se publică nimic.
      - name: Typecheck frontend
        run: yarn tsc --noEmit

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opțional, când ai cont Apple Developer (semnare + notarizare, fără avertismente la instalare):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "AI Quota Widget v__VERSION__"
          releaseBody: "See INSTALL.md for install notes (Windows SmartScreen / macOS Gatekeeper)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
